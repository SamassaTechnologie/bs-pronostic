# Déclenchement manuel de la synchronisation (onglet Actions > Run workflow).
# La planification automatique toutes les 3 heures est assurée par Supabase (pg_cron + pg_net,
# tâches « sam-wake » et « sam-sync »). Secrets GitHub requis : BACKEND_URL et CRON_SECRET.
name: Synchronisation manuelle
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Vérification des secrets
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "Ajoutez les secrets BACKEND_URL et CRON_SECRET (Settings > Secrets and variables > Actions)."; exit 1
          fi
      - name: Réveil du backend
        run: curl -sS --retry 5 --retry-delay 20 --max-time 90 "${{ secrets.BACKEND_URL }}/api/health"
      - name: Lancement de la synchronisation
        run: |
          curl -sS --fail --max-time 60 -X POST "${{ secrets.BACKEND_URL }}/api/cron/run" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
